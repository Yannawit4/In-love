<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>คุณชอบฉันไหม? 💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Itim&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
        }

        body {
            background: #fff0f5;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(255, 182, 213, 0.45), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(255, 200, 225, 0.40), transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(255, 240, 248, 0.9), transparent 70%);
            font-family: 'Mali', 'Itim', 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #4a2436;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* ===== หน้าโหลด ===== */
        .loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #fff5fa 0%, #ffe4ee 100%);
            z-index: 30;
            padding: 16px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-screen.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loading-title {
            font-family: 'Mali', cursive;
            font-size: 26px;
            font-weight: 700;
            color: #ff6fa5;
            margin: 0 0 10px 0;
            text-shadow: 0 2px 12px rgba(255, 111, 165, 0.25);
            animation: bounce 1.4s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }

        .loading-subtitle {
            font-family: 'Itim', 'Mali', cursive;
            font-size: 15px;
            color: #c97a9b;
            margin: 0 0 28px 0;
        }

        .spinner {
            width: 56px;
            height: 56px;
            border: 4px solid #ffd9e7;
            border-top: 4px solid #ff7fb0;
            border-right: 4px solid #ff9cc4;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            box-shadow: 0 6px 24px rgba(255, 127, 176, 0.35);
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== หน้าคำถาม ===== */
        .question-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 5;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .question-screen.hide {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        .cookie-card {
            background: #ffffff;
            border-radius: 26px;
            padding: 44px 40px 36px;
            max-width: 460px;
            width: 100%;
            box-shadow:
                0 20px 60px rgba(255, 111, 165, 0.25),
                0 8px 24px rgba(255, 140, 190, 0.15);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            text-align: center;
            border: 3px dashed #ffb6d3;
            outline: 2px dashed #ffd9e7;
            outline-offset: 6px;
        }

        .cookie-card::before,
        .cookie-card::after {
            content: '💖';
            position: absolute;
            font-size: 22px;
            opacity: 0.65;
            animation: floatHeart 3s ease-in-out infinite;
        }

        .cookie-card::before {
            top: -14px;
            left: 18px;
        }

        .cookie-card::after {
            bottom: -10px;
            right: 22px;
            animation-delay: 1.2s;
        }

        @keyframes floatHeart {
            0%, 100% { transform: translateY(0) rotate(-8deg); }
            50%      { transform: translateY(-10px) rotate(8deg); }
        }

        @keyframes popIn {
            0%   { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1);   opacity: 1; }
        }

        .cookie-title {
            font-family: 'Mali', cursive;
            font-size: 30px;
            font-weight: 700;
            color: #ff5a92;
            margin: 0 0 32px 0;
            line-height: 1.3;
            text-shadow: 0 2px 12px rgba(255, 111, 165, 0.2);
        }

        /* 🔑 เรียงปุ่มเป็นแนวตั้ง: "ใช่แล้ว" อยู่บน / "ไม่โว้ย" อยู่ล่าง */
        .cookie-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: stretch;
        }

        .btn {
            width: 100%;
            font-family: 'Mali', cursive;
            font-weight: 700;
            font-size: 16px;
            padding: 14px 20px;
            border-radius: 16px;
            cursor: pointer;
            transition:
                transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                background 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.35s ease;
            border: 2px solid transparent;
            white-space: nowrap;
            line-height: 1.2;
            transform-origin: center center;
            will-change: transform;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff9cc4, #ff6fa5);
            color: #ffffff;
            border-color: #ff8bb8;
            box-shadow: 0 6px 18px rgba(255, 111, 165, 0.4), inset 0 -2px 0 rgba(220, 70, 130, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #ffb0d0, #ff7fb0);
            box-shadow: 0 8px 24px rgba(255, 111, 165, 0.55), inset 0 -2px 0 rgba(220, 70, 130, 0.3);
            transform: translateY(-2px) scale(1.02);
        }

        .btn-primary:active {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 3px 10px rgba(255, 111, 165, 0.4);
        }

        .btn-secondary {
            background: #fff5fa;
            color: #d16697;
            border-color: #ffd0e2;
        }

        .btn-secondary:hover {
            background: #ffe8f2;
            border-color: #ffb6d3;
            color: #c34d84;
        }

        .btn-secondary:active {
            background: #ffdceb;
            /* 🔑 ไม่ใช้ transform ตอน active เพื่อไม่ให้ตำแหน่งกระโดด */
        }

        /* ===== หน้าผลลัพธ์ ===== */
        .result-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.92);
            transition:
                opacity 0.6s ease,
                transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                visibility 0.6s;
            z-index: 10;
        }

        .result-screen.show {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        .result-content {
            position: relative;
            z-index: 2;
            max-width: 620px;
        }

        .big-heart {
            font-size: clamp(56px, 16vw, 96px);
            line-height: 1;
            display: inline-block;
            animation: heartBeat 1.1s ease-in-out infinite;
            filter: drop-shadow(0 10px 24px rgba(255, 111, 165, 0.45));
            margin-bottom: 12px;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            14%      { transform: scale(1.18); }
            28%      { transform: scale(1); }
            42%      { transform: scale(1.14); }
            70%      { transform: scale(1); }
        }

        .result-title {
            font-family: 'Mali', cursive;
            font-weight: 700;
            font-size: clamp(30px, 9vw, 56px);
            line-height: 1.25;
            margin: 0 0 18px 0;
            background: linear-gradient(120deg, #ff4f8b 0%, #ff8bb8 45%, #ff4f8b 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 3s linear infinite;
            filter: drop-shadow(0 6px 18px rgba(255, 111, 165, 0.35));
        }

        @keyframes shine {
            0%   { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .result-sub {
            font-family: 'Itim', 'Mali', cursive;
            font-size: clamp(15px, 4.2vw, 20px);
            color: #c96b96;
            margin: 0;
            line-height: 1.6;
        }

        /* ใจลอย */
        .floating-heart {
            position: absolute;
            bottom: -70px;
            z-index: 1;
            pointer-events: none;
            user-select: none;
            animation-name: floatUp;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
            will-change: transform, opacity;
        }

        @keyframes floatUp {
            0%   { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            12%  { opacity: 1; }
            85%  { opacity: 0.9; }
            100% { transform: translateY(-118vh) rotate(360deg) scale(1.1); opacity: 0; }
        }

        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            .cookie-card {
                padding: 36px 22px 28px;
                border-radius: 22px;
                border-width: 2.5px;
                outline-width: 1.5px;
                outline-offset: 5px;
            }

            .cookie-title {
                font-size: 24px;
                margin-bottom: 26px;
            }

            .btn {
                font-size: 15px;
                border-radius: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- ===== หน้าโหลด ===== -->
    <div id="loading-screen" class="loading-screen">
        <p class="loading-title">💖 กำลังโหลด...</p>
        <p class="loading-subtitle">ขอเวลาสักนิดนะคะ~</p>
        <div class="spinner"></div>
    </div>

    <!-- ===== หน้าคำถาม ===== -->
    <div id="question-screen" class="question-screen">
        <div class="cookie-card">
            <h2 class="cookie-title">คุณชอบฉันไหม?</h2>

            <!-- 🔑 เอา "ใช่แล้ว" ไว้บน และ "ไม่โว้ยไอกาก" ไว้ล่าง -->
            <div class="cookie-buttons">
                <button id="accept-button" class="btn btn-primary">ใช่แล้ว😘</button>
                <button id="decline-button" class="btn btn-secondary">ไม่โว้ยไอกาก</button>
            </div>
        </div>
    </div>

    <!-- ===== หน้าผลลัพธ์ ===== -->
    <div id="result-screen" class="result-screen">
        <div class="result-content">
            <div class="big-heart">💖</div>
            <h1 class="result-title">เราเป็นแฟนกันแล้วนะ</h1>
            <p class="result-sub">ห้ามเปลี่ยนใจแล้วน้า~ 💕</p>
        </div>
    </div>

    <script>
        /* ================= ELEMENTS ================= */
        const loadingScreen  = document.getElementById('loading-screen');
        const questionScreen = document.getElementById('question-screen');
        const resultScreen   = document.getElementById('result-screen');
        const declineBtn     = document.getElementById('decline-button');
        const acceptBtn      = document.getElementById('accept-button');

        /* ================= หน้าโหลด ================= */
        window.addEventListener('load', () => {
            setTimeout(() => loadingScreen.classList.add('hide'), 900);
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 1500);
        });

        setTimeout(() => loadingScreen.classList.add('hide'), 3000);

        /* ================= ปุ่ม "ไม่โว้ยไอกาก" =================
           ใช้ transform: scale() ในการหด
           → ปุ่มไม่เปลี่ยนขนาดกล่อง/layout
           → ไม่วาร์ป ไม่กระโดด
           → 1 คลิก = หด 1 สเต็ป
        ===================================================== */
        let declineScale = 1;
        const MIN_SCALE = 0.22;
        let declineDead = false;

        declineBtn.addEventListener('click', () => {
            if (declineDead) return;

            declineScale *= 0.82;

            if (declineScale <= MIN_SCALE) {
                declineScale = MIN_SCALE;
                declineDead = true;

                declineBtn.style.transform = `scale(${declineScale})`;
                declineBtn.style.pointerEvents = 'none';
                declineBtn.style.cursor = 'default';
                declineBtn.disabled = true;

                setTimeout(() => {
                    declineBtn.style.opacity = '0';
                }, 120);

                return;
            }

            declineBtn.style.transform = `scale(${declineScale})`;
        });

        /* ================= ปุ่ม "ใช่แล้ว" ================= */
        acceptBtn.addEventListener('click', () => {
            questionScreen.classList.add('hide');

            setTimeout(() => {
                questionScreen.style.display = 'none';
                resultScreen.classList.add('show');
                startHearts();
            }, 320);
        });

        /* ================= ใจลอย ================= */
        const HEART_EMOJIS = ['💖', '💕', '💗', '💞', '💓', '🌸', '✨', '💘'];
        let heartRunning = false;

        function spawnHeart() {
            if (!heartRunning) return;

            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = HEART_EMOJIS[Math.floor(Math.random() * HEART_EMOJIS.length)];

            heart.style.left = (Math.random() * 96) + 'vw';
            heart.style.fontSize = (16 + Math.random() * 32) + 'px';
            heart.style.animationDuration = (4.5 + Math.random() * 4) + 's';
            heart.style.opacity = 0;

            resultScreen.appendChild(heart);

            setTimeout(() => heart.remove(), 9000);
        }

        function startHearts() {
            if (heartRunning) return;
            heartRunning = true;

            for (let i = 0; i < 8; i++) {
                setTimeout(spawnHeart, i * 120);
            }

            setInterval(spawnHeart, 420);
        }

        /* ================= ล็อกไม่ให้ scroll ================= */
        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    </script>

</body>
</html>
